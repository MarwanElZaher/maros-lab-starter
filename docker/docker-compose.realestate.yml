version: "3.9"

# Standalone real-estate stack (MAR-109)
# Hosts: realestate.marwanelzaher.info (via CF Tunnel → Traefik)
# CF Access app already exists (MAR-98) — no new provisioning needed.
#
# Deploy:
#   cd /home/marwanelzaher/ai-company/maros-lab-starter
#   make deploy-realestate
#
# Env file: docker/.env.realestate (OPENROUTER_API_KEY)

services:
  realestate-ui:
    build:
      context: ../services/realestate-ui
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OLX_SCRAPER_URL: "http://olx-scraper:3001"
    mem_limit: 512m
    networks:
      - n8n_default
    labels:
      - traefik.enable=true
      - "traefik.http.routers.realestate-ui.rule=Host(`realestate.marwanelzaher.info`)"
      - traefik.http.routers.realestate-ui.entrypoints=web,websecure
      - traefik.http.routers.realestate-ui.tls=true
      - traefik.http.routers.realestate-ui.tls.certresolver=mytlschallenge
      - traefik.http.services.realestate-ui.loadbalancer.server.port=3000
      - traefik.docker.network=n8n_default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://0.0.0.0:3000/', r => process.exit(r.statusCode < 500 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  olx-scraper:
    build:
      context: ../services/olx-scraper
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "3001"
    mem_limit: 1g
    networks:
      - n8n_default
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3001/health', r => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  n8n_default:
    external: true
