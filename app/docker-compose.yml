services:
  rag-app:
    build: .
    ports:
      - "8088:8088"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://openrouter.ai/api/v1}
      - DATA_DIR=/data
    volumes:
      - ./data:/data
      - /host/ai-company/pwc-rag-task/sources:/host/ai-company/pwc-rag-task/sources:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8088/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
