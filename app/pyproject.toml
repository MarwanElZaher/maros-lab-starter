[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pwc-rag"
version = "0.1.0"
description = "PwC Senior AI Engineer take-home — multi-source RAG prototype"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "duckdb>=0.10",
    "chromadb>=0.5",
    "sentence-transformers>=3.0",
    "openai>=1.30",
    "openpyxl>=3.1",
    "python-docx>=1.1",
    "Pillow>=10.0",
    "pytesseract>=0.3",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "sse-starlette>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
]

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
